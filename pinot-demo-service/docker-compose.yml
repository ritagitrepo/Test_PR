services:
  pinot:
    image: apachepinot/pinot:latest
    command: QuickStart -type batch
    ports:
      - "9000:9000"
      - "8099:8000"  # quickstart broker listens on 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health && curl -sf 'http://localhost:9000/tables' | grep -q baseballStats"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  pinot-demo-service:
    build: .
    environment:
      PINOT_BROKER_URL: http://pinot:8000
      PINOT_CONTROLLER_URL: http://pinot:9000
    ports:
      - "8000:8000"
    depends_on:
      pinot:
        condition: service_healthy
